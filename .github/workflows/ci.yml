name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  typescript:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck

  python:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: python -m compileall -q sdks recipes

  live:
    name: live
    # Runs the SDK examples against the real gateway. Only on push to main and manual runs, never on pull requests
    # or the schedule, and skipped when no key is set. The stop-a-runaway-agent recipe is never run here: it loops on purpose.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      OPENPIKE_API_KEY: ${{ secrets.OPENPIKE_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Skip when no key is set
        id: key
        run: |
          if [ -z "$OPENPIKE_API_KEY" ]; then echo "set=false" >> "$GITHUB_OUTPUT"; echo "No OPENPIKE_API_KEY secret; skipping."; else echo "set=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.key.outputs.set == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - if: steps.key.outputs.set == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - if: steps.key.outputs.set == 'true'
        run: |
          npm ci
          pip install -r requirements.txt
          set -e
          for f in sdks/*/*.py sdks/*/*.ts; do
            case "$f" in *runaway*) echo "== skip $f"; continue;; esac
            echo "== $f"
            case "$f" in *.py) python "$f";; *.ts) npx tsx "$f";; esac
          done
